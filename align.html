<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bracket Alignment Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a1a; color: #eee; font-family: monospace; font-size: 12px; display: flex; height: 100vh; overflow: hidden; }
#viewport { flex: 1; position: relative; }
canvas { display: block; width: 100%; height: 100%; }
#panel {
  width: 280px; flex-shrink: 0; background: #252525; border-left: 1px solid #444;
  display: flex; flex-direction: column; overflow: hidden;
}
#panel h2 { padding: 10px 12px; background: #333; font-size: 13px; border-bottom: 1px solid #555; }
#controls { flex: 1; overflow-y: auto; padding: 10px 12px; }
.section { margin-bottom: 14px; }
.section-title { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 3px; }
.row { display: flex; align-items: center; margin-bottom: 5px; gap: 6px; }
.row label { width: 20px; color: #88aacc; font-weight: bold; flex-shrink: 0; }
.row input[type=range] { flex: 1; accent-color: #4488cc; }
.row input[type=number] { width: 64px; background: #1a1a1a; border: 1px solid #444; color: #eee; padding: 2px 4px; font-family: monospace; font-size: 11px; }
#status { padding: 8px 12px; font-size: 11px; color: #aaa; background: #222; border-top: 1px solid #333; border-bottom: 1px solid #333; min-height: 28px; }
#output { margin: 10px 12px; background: #1a1a1a; border: 1px solid #444; padding: 8px; font-size: 10px; color: #8cf; white-space: pre; line-height: 1.5; }
#copy-btn {
  margin: 0 12px 12px; padding: 8px; background: #1a5a8a; border: 1px solid #2a7ab0;
  color: #fff; font-family: monospace; font-size: 12px; cursor: pointer; width: calc(100% - 24px);
}
#copy-btn:hover { background: #2a6a9a; }
#copy-btn.copied { background: #1a7a3a; border-color: #2a9a4a; }
.hint { font-size: 10px; color: #666; padding: 4px 12px 8px; line-height: 1.5; }
</style>
</head>
<body>

<div id="viewport"><canvas id="c"></canvas></div>

<div id="panel">
  <h2>🔧 Bracket Alignment Tool</h2>
  <div id="status">Loading STEP…</div>

  <div id="controls">
    <div class="section">
      <div class="section-title">Position (mm)</div>
      <div class="row"><label>X</label><input type="range" id="px" min="-100" max="100" value="0" step="0.5"><input type="number" id="px-n" value="0" step="0.5"></div>
      <div class="row"><label>Y</label><input type="range" id="py" min="-100" max="100" value="0" step="0.5"><input type="number" id="py-n" value="0" step="0.5"></div>
      <div class="row"><label>Z</label><input type="range" id="pz" min="-100" max="100" value="0" step="0.5"><input type="number" id="pz-n" value="0" step="0.5"></div>
    </div>
    <div class="section">
      <div class="section-title">Rotation (degrees)</div>
      <div class="row"><label>X</label><input type="range" id="rx" min="-180" max="180" value="0" step="1"><input type="number" id="rx-n" value="0" step="1"></div>
      <div class="row"><label>Y</label><input type="range" id="ry" min="-180" max="180" value="0" step="1"><input type="number" id="ry-n" value="0" step="1"></div>
      <div class="row"><label>Z</label><input type="range" id="rz" min="-180" max="180" value="0" step="1"><input type="number" id="rz-n" value="0" step="1"></div>
    </div>
    <div class="section">
      <div class="section-title">Reference Corner</div>
      <div class="row"><label style="width:auto;color:#eee">Corner</label>
        <select id="corner-sel" style="flex:1;background:#1a1a1a;border:1px solid #444;color:#eee;font-family:monospace;padding:2px">
          <option value="fl">Front-Left  (+X arm / −Z arm)</option>
          <option value="fr">Front-Right (−X arm / −Z arm)</option>
          <option value="bl">Back-Left   (+X arm / +Z arm)</option>
          <option value="br">Back-Right  (−X arm / +Z arm)</option>
        </select>
      </div>
    </div>

    <div id="output">{
  position: [0, 0, 0],
  rotation: [0, 0, 0]
}</div>
    <button id="copy-btn" onclick="copyTransform()">Copy Transform JSON</button>
    <div class="hint">
      Orbit: LMB drag<br>
      Pan: RMB drag<br>
      Zoom: scroll<br><br>
      <span style="color:#f88">Red/Green/Blue = X/Y/Z axes</span><br>
      <span style="color:#8cf">Cyan = bracket (STEP)</span><br>
      <span style="color:#aaa">Gray = reference 2040 extrusions</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Three.js setup ──────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x111318);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 10000);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(200, 300, 150);
scene.add(sun);
scene.add(new THREE.AxesHelper(60));
scene.add(new THREE.GridHelper(400, 20, 0x333333, 0x222222));

// Reference extrusion corner (front-left by default: arms along +X and -Z)
const matRef = new THREE.MeshPhongMaterial({color:0x888899, opacity:0.7, transparent:true});
const refGroup = new THREE.Group();
scene.add(refGroup);

function buildCorner(dirX, dirZ) {
  refGroup.clear();
  const L = 80, W = 40, N = 20;
  // Arm along X direction
  const g1 = new THREE.Mesh(new THREE.BoxGeometry(L, W, N), matRef);
  g1.position.set(dirX * L/2, W/2, 0);
  // Arm along Z direction
  const g2 = new THREE.Mesh(new THREE.BoxGeometry(N, W, L), matRef);
  g2.position.set(0, W/2, dirZ * L/2);
  refGroup.add(g1, g2);
}
buildCorner(1, -1);

// Bracket mesh placeholder
const matBracket = new THREE.MeshPhongMaterial({color:0x44aacc, wireframe:false});
let bracketMesh = null;

// ── Orbit ───────────────────────────────────────────────────
const orb = { theta: Math.PI*0.25, phi: Math.PI/3.5, r: 300, target: new THREE.Vector3(20, 20, -20), drag: false, btn: -1, last: {x:0,y:0} };

function applyOrbit() {
  camera.position.set(
    orb.target.x + orb.r * Math.sin(orb.phi) * Math.sin(orb.theta),
    orb.target.y + orb.r * Math.cos(orb.phi),
    orb.target.z + orb.r * Math.sin(orb.phi) * Math.cos(orb.theta)
  );
  camera.lookAt(orb.target);
}
applyOrbit();

canvas.addEventListener('mousedown', e => { orb.drag=true; orb.btn=e.button; orb.last={x:e.clientX,y:e.clientY}; e.preventDefault(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!orb.drag) return;
  const dx=e.clientX-orb.last.x, dy=e.clientY-orb.last.y;
  orb.last={x:e.clientX,y:e.clientY};
  if (orb.btn===0) { orb.theta-=dx*0.01; orb.phi=Math.max(0.05,Math.min(Math.PI*0.48,orb.phi-dy*0.01)); }
  else if (orb.btn===2) {
    const r=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);
    const u=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
    const s=orb.r/canvas.clientWidth*1.5;
    orb.target.addScaledVector(r,-dx*s); orb.target.addScaledVector(u,dy*s);
  }
  applyOrbit();
});
window.addEventListener('mouseup', ()=>{ orb.drag=false; });
canvas.addEventListener('wheel', e=>{ orb.r=Math.max(10,orb.r*(1+e.deltaY*0.001)); applyOrbit(); e.preventDefault(); },{passive:false});

// ── Resize ──────────────────────────────────────────────────
function onResize() {
  const vp = document.getElementById('viewport');
  renderer.setSize(vp.clientWidth, vp.clientHeight);
  camera.aspect = vp.clientWidth / vp.clientHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── Render loop ─────────────────────────────────────────────
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();

// ── Controls ────────────────────────────────────────────────
const ids = ['px','py','pz','rx','ry','rz'];

function getVal(id) { return parseFloat(document.getElementById(id+'-n').value) || 0; }

function updateBracket() {
  if (!bracketMesh) return;
  bracketMesh.position.set(getVal('px'), getVal('py'), getVal('pz'));
  bracketMesh.rotation.set(
    getVal('rx') * Math.PI/180,
    getVal('ry') * Math.PI/180,
    getVal('rz') * Math.PI/180
  );
  updateOutput();
}

function updateOutput() {
  const p = [getVal('px'), getVal('py'), getVal('pz')];
  const r = [getVal('rx'), getVal('ry'), getVal('rz')];
  document.getElementById('output').textContent =
    `{\n  position: [${p.map(v=>v.toFixed(1)).join(', ')}],\n  rotation: [${r.map(v=>v.toFixed(1)).join(', ')}]\n}`;
}

ids.forEach(id => {
  const slider = document.getElementById(id);
  const num    = document.getElementById(id+'-n');
  slider.addEventListener('input', () => { num.value = slider.value; updateBracket(); });
  num.addEventListener('input',    () => { slider.value = num.value; updateBracket(); });
});

document.getElementById('corner-sel').addEventListener('change', e => {
  const corners = { fl:[1,-1], fr:[-1,-1], bl:[1,1], br:[-1,1] };
  const [dx,dz] = corners[e.target.value];
  buildCorner(dx, dz);
});

function copyTransform() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent='Copy Transform JSON'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── STEP loading ─────────────────────────────────────────────
function toF32(v) {
  if (v instanceof Float32Array) return v;
  if (v instanceof Float64Array) return new Float32Array(v);
  if (typeof v?.size === 'function') { const a=new Float32Array(v.size()); for(let i=0;i<a.length;i++) a[i]=v.get(i); return a; }
  return new Float32Array(v);
}
function toU32(v) {
  if (v instanceof Uint32Array) return v;
  if (typeof v?.size === 'function') { const a=new Uint32Array(v.size()); for(let i=0;i<a.length;i++) a[i]=v.get(i); return a; }
  return new Uint32Array(v);
}

function stepToGeo(meshes) {
  const list = typeof meshes.size==='function'
    ? Array.from({length:meshes.size()},(_,i)=>meshes.get(i))
    : Array.from(meshes);

  const pos=[], nor=[], idx=[];
  let off=0;
  for (const m of list) {
    const posAttr = m.attributes?.position;
    const norAttr = m.attributes?.normal;
    const idxAttr = m.index;
    if (!posAttr) continue;
    const pa = toF32(posAttr.array ?? posAttr);
    const na = norAttr ? toF32(norAttr.array ?? norAttr) : null;
    const ia = toU32(idxAttr?.array ?? idxAttr);
    const vc = pa.length / 3;
    for (const v of pa) pos.push(v);
    if (na) for (const n of na) nor.push(n);
    for (const i of ia) idx.push(i+off);
    off += vc;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  if (nor.length) geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nor), 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
  if (!nor.length) geo.computeVertexNormals();
  geo.computeBoundingBox();
  return geo;
}

async function loadBracket() {
  const el = document.getElementById('status');
  try {
    await new Promise((res,rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/occt-import-js.js';
      s.onload=res; s.onerror=()=>rej(new Error('CDN load failed'));
      document.head.appendChild(s);
    });
    const oc = await window.occtimportjs({ locateFile: f => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/${f}` });
    el.textContent = 'Fetching STEP…';
    const buf = await fetch('2040 ANGLE BRACKET-FLAT 01 2024.STEP').then(r=>{ if(!r.ok) throw new Error('fetch failed'); return r.arrayBuffer(); });
    const res = oc.ReadStepFile(new Uint8Array(buf), null);
    const mCount = typeof res.meshes?.size==='function' ? res.meshes.size() : res.meshes?.length;
    if (!res.success || !mCount) throw new Error('parse failed');

    const geo = stepToGeo(res.meshes);
    const bb = geo.boundingBox;
    const sz = new THREE.Vector3();
    bb.getSize(sz);

    bracketMesh = new THREE.Mesh(geo, matBracket);
    scene.add(bracketMesh);

    el.style.color = '#4f4';
    el.textContent = `✓ Loaded — size: ${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)} mm`;
    updateBracket();

    // Log raw bb so we know the native orientation
    console.log('Bracket BB:', bb.min, bb.max, 'Size:', sz);
  } catch(e) {
    el.style.color = '#f88';
    el.textContent = '✗ ' + e.message;
  }
}

loadBracket();
</script>
</body>
</html>
