// ── Voron model loader ─────────────────────────────────────
// Prefers voron_*.glb (Draco-compressed), falls back to voron_*.obj + mtl.
const voronLoadState = {};
const voronGeoCache  = {};

function onVoronLoaded(key, object) {
  // Fusion 360 exports Z-forward — rotate upright
  object.rotation.set(-Math.PI / 2, 0, 0);
  object.updateMatrixWorld(true);
  object.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      m.side = THREE.DoubleSide;
      if (m.opacity < 0.99) {
        m.transparent = true;
        m.depthWrite  = false;
        m.opacity     = Math.max(m.opacity, 0.12); // keep barely-visible parts visible
      }
    });
  });

  scene.add(object);
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(object);
  scene.remove(object);

  const ctr = box.getCenter(new THREE.Vector3());
  const sz  = box.getSize(new THREE.Vector3());
  object.position.set(-ctr.x, -box.min.y, -ctr.z);

  const realGrp = new THREE.Group();
  realGrp.add(object);

  const pad = 20;
  PRINTER_SPECS[key].fw   = sz.x;
  PRINTER_SPECS[key].fd   = sz.z;
  PRINTER_SPECS[key].fh   = sz.y;
  PRINTER_SPECS[key].minW = sz.x + pad * 2;
  PRINTER_SPECS[key].minD = sz.z + pad * 2;
  PRINTER_SPECS[key].minH = sz.y + pad * 2;

  voronGeoCache[key] = { realGrp, height: sz.y };
  voronLoadState[key] = 'done';
  console.log(`[Voron] ${key} ✓  ${sz.x.toFixed(0)}×${sz.z.toFixed(0)}×${sz.y.toFixed(0)} mm`);

  applyVoronGeo(key);
  const {W, D, H} = state;
  updatePrinters(W, D, H);
  ensurePrinterGroups(W, D, H);
}

function loadAllVoronPrinters() {
  const dracoLoader = typeof THREE.DRACOLoader !== 'undefined' ? (() => {
    const dl = new THREE.DRACOLoader();
    dl.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    dl.setDecoderConfig({ type: 'js' }); // force JS decoder — avoids WASM version mismatches with r128
    dl.preload();
    return dl;
  })() : null;

  printerOrder.forEach(key => {
    voronLoadState[key] = 'loading';
    const glbFile = `voron_${key === 'v02' ? 'v02' : key}.glb`;
    const objFile = `voron_${key === 'v02' ? 'v02' : key}.obj`;
    const mtlFile = `voron_${key === 'v02' ? 'v02' : key}.mtl`;

    // Try GLB first
    if (typeof THREE.GLTFLoader !== 'undefined') {
      const gltfLoader = new THREE.GLTFLoader();
      if (dracoLoader) gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.load(
        glbFile,
        gltf => onVoronLoaded(key, gltf.scene),
        null,
        () => tryOBJ()  // GLB not found, fall back to OBJ
      );
    } else { tryOBJ(); }

    function tryOBJ() {
      if (typeof THREE.OBJLoader === 'undefined') {
        voronLoadState[key] = 'error'; return;
      }
      function loadWithMat(mat) {
        const loader = new THREE.OBJLoader();
        if (mat) loader.setMaterials(mat);
        loader.load(objFile,
          obj => onVoronLoaded(key, obj),
          null,
          () => { voronLoadState[key] = 'error'; console.warn(`[Voron] ${key} — no GLB or OBJ found`); }
        );
      }
      const mtlLoader = new THREE.MTLLoader();
      mtlLoader.load(mtlFile,
        m => { m.preload(); loadWithMat(m); },
        null,
        () => loadWithMat(null)
      );
    }
  });
}

function applyVoronGeo(key) {
  const grp = printerGroups[key];
  const cache = voronGeoCache[key];
  if (!grp || !cache) return;

  while (grp.children.length) grp.remove(grp.children[0]);
  grp.add(cache.realGrp.clone());

  // Label
  const spec = PRINTER_SPECS[key];
  const lc = document.createElement('canvas'); lc.width=256; lc.height=64;
  const lx = lc.getContext('2d');
  lx.font='bold 36px monospace'; lx.textAlign='center';
  lx.fillStyle='#ffffff'; lx.globalAlpha=0.75;
  lx.fillText('Voron '+spec.label, 128, 44);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(lc), transparent:true, depthTest:false}));
  sp.scale.set(140, 35, 1);
  sp.position.set(0, cache.height + 40, 0);
  grp.add(sp);

  // Re-pop animation
  printerScale[key] = 0;
  if (grp._vel !== undefined) grp._vel = 0;
}

// ── Voron printer models ───────────────────────────────────
// Minimum INTERIOR dimensions (W, D, H) mm to show each printer
const PRINTER_SPECS = {
  v02:     { label:'V0.2',    fw:235, fd:235, fh:235, bed:120, zMotors:0, accent:0xe05555, minW:270, minD:270, minH:270 },
  trident: { label:'Trident', fw:310, fd:310, fh:370, bed:250, zMotors:3, accent:0x7c6bbf, minW:370, minD:370, minH:430 },
  v24:     { label:'Cascade', fw:370, fd:370, fh:430, bed:350, zMotors:4, accent:0x44aa77, minW:450, minD:450, minH:510 },
};
const printerOrder = ['v24','trident','v02']; // priority: Cascade > Trident > V0.2

const matFrame3d  = new THREE.MeshPhysicalMaterial({color:0x2a2a2a, metalness:0.2, roughness:0.7});
const matBed3d    = new THREE.MeshPhysicalMaterial({color:0x111111, metalness:0.1, roughness:0.55});
const matGantry3d = new THREE.MeshPhysicalMaterial({color:0xaaaaaa, metalness:0.6, roughness:0.3});

function buildPrinterGroup(key) {
  const s = PRINTER_SPECS[key];
  const g = new THREE.Group();
  const W=s.fw, D=s.fd, H=s.fh;
  const ex = 10; // extrusion thickness

  const matAcc = new THREE.MeshPhysicalMaterial({color:s.accent, metalness:0.1, roughness:0.5});

  // 12-edge frame from boxes
  function rail(sx,sy,sz, px,py,pz) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), matFrame3d.clone());
    m.position.set(px,py,pz); m.castShadow=true; g.add(m);
  }
  // 4 vertical posts
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=> rail(ex,H,ex, a*(W/2-ex/2),H/2,b*(D/2-ex/2)));
  // Bottom ring
  rail(W-ex*2,ex,ex,  0,ex/2,-(D/2-ex/2));
  rail(W-ex*2,ex,ex,  0,ex/2,  D/2-ex/2);
  rail(ex,ex,D-ex*2,  -(W/2-ex/2),ex/2,0);
  rail(ex,ex,D-ex*2,   (W/2-ex/2),ex/2,0);
  // Top ring
  rail(W-ex*2,ex,ex,  0,H-ex/2,-(D/2-ex/2));
  rail(W-ex*2,ex,ex,  0,H-ex/2,  D/2-ex/2);
  rail(ex,ex,D-ex*2,  -(W/2-ex/2),H-ex/2,0);
  rail(ex,ex,D-ex*2,   (W/2-ex/2),H-ex/2,0);

  // Build plate
  const bGeo = new THREE.BoxGeometry(s.bed, 6, s.bed);
  const bed = new THREE.Mesh(bGeo, matBed3d.clone());
  bed.position.set(0, s.zMotors>0 ? H*0.28 : H*0.22, 0);
  bed.castShadow=true; g.add(bed);

  // Heated bed glow accent lines
  const hLine = new THREE.Mesh(new THREE.BoxGeometry(s.bed*0.85, 2, 4), matAcc.clone());
  hLine.position.set(0, bed.position.y+4, 0); g.add(hLine);

  // Gantry X rail
  const gantryY = key==='v24' ? H*0.78 : H-ex*2.5;
  const xRail = new THREE.Mesh(new THREE.BoxGeometry(W-ex*2, 8, 8), matGantry3d.clone());
  xRail.position.set(0, gantryY, 0); g.add(xRail);

  // For V2.4 add second Y rail
  if (key==='v24') {
    const yRail = new THREE.Mesh(new THREE.BoxGeometry(8, 8, D-ex*2), matGantry3d.clone());
    yRail.position.set(0, gantryY+8, 0); g.add(yRail);
  }

  // Toolhead
  const th = new THREE.Mesh(new THREE.BoxGeometry(28,32,22), matAcc.clone());
  th.position.set(0, gantryY-14, key==='v24'?0:-D*0.15); g.add(th);
  // Hotend nozzle
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(3,1.5,12,8), matAcc.clone());
  nozzle.position.set(0, gantryY-30, key==='v24'?0:-D*0.15); g.add(nozzle);

  // Z motors (cylinders at corners for Trident/2.4)
  if (s.zMotors===4) {
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
      const zm = new THREE.Mesh(new THREE.BoxGeometry(22,30,22), matAcc.clone());
      zm.position.set(a*(W/2-15), 15, b*(D/2-15)); g.add(zm);
    });
  } else if (s.zMotors===3) {
    [[0,1],[-1,-1],[1,-1]].forEach(([a,b])=>{
      const zm = new THREE.Mesh(new THREE.BoxGeometry(22,30,22), matAcc.clone());
      zm.position.set(a*(W/2-20)*0.8, 15, b*(D/2-20)*0.8); g.add(zm);
    });
  }

  // Label sprite (small floating text above)
  const lc = document.createElement('canvas'); lc.width=256; lc.height=64;
  const lx = lc.getContext('2d');
  lx.fillStyle='rgba(0,0,0,0)'; lx.fillRect(0,0,256,64);
  lx.font='bold 36px monospace'; lx.textAlign='center';
  lx.fillStyle='#ffffff'; lx.globalAlpha=0.75;
  lx.fillText('Voron '+s.label, 128, 44);
  const ltex = new THREE.CanvasTexture(lc);
  const lmat = new THREE.SpriteMaterial({map:ltex, transparent:true, depthTest:false});
  const sprite = new THREE.Sprite(lmat);
  sprite.scale.set(120, 30, 1);
  sprite.position.set(0, H+32, 0);
  g.add(sprite);

  return g;
}

// State for pop-in animation
const printerGroups = {};
const printerScale  = { v02:0, trident:0, v24:0 };
const printerTarget = { v02:0, trident:0, v24:0 };
let printersDirty = false;

function updatePrinters(encW, encD, encH) {
  const margin = 40;
  const minGap = 20;

  // Step 1: which printers fit individually?
  let showing = printerOrder.filter(k => {
    const s = PRINTER_SPECS[k];
    return s.fw + margin*2 <= encW && s.fd + margin*2 <= encD && s.fh + margin*2 <= encH;
  });

  // Step 2: do they fit together width-wise? Drop lowest priority first until they do
  while (showing.length > 1) {
    const totalFW = showing.reduce((a, k) => a + PRINTER_SPECS[k].fw, 0);
    const needed  = totalFW + minGap * (showing.length - 1) + margin * 2;
    if (needed <= encW) break;
    // Drop the lowest-priority printer (last in printerOrder)
    const lowestPri = showing.reduce((a, k) =>
      printerOrder.indexOf(k) > printerOrder.indexOf(a) ? k : a);
    showing = showing.filter(k => k !== lowestPri);
  }

  printerOrder.forEach(key => { printerTarget[key] = showing.includes(key) ? 1 : 0; });
  printersDirty = true;
}

function layoutPrinters(encW, encD, encH) {
  // Ensure groups exist
  printerOrder.forEach(key => {
    if (!printerGroups[key]) {
      const grp = buildPrinterGroup(key);
      grp.scale.setScalar(0);
      scene.add(grp);
      printerGroups[key] = grp;
      if (voronGeoCache[key]) applyVoronGeo(key);
    }
  });

  // Only position printers that SHOULD be visible — let departing ones shrink in place
  const showing = printerOrder.filter(k => printerTarget[k] > 0);
  if (showing.length === 0) return;

  const totalFW = showing.reduce((a, k) => a + PRINTER_SPECS[k].fw, 0);
  const availW  = encW - 80;
  const rawGap  = showing.length > 1 ? (availW - totalFW) / (showing.length - 1) : 0;
  const gap     = Math.max(20, Math.min(80, rawGap));
  const totalW  = totalFW + gap * (showing.length - 1);

  let x = -totalW / 2;
  showing.forEach(key => {
    const s = PRINTER_SPECS[key];
    printerGroups[key].position.set(x + s.fw/2, 0, -encD/2);
    x += s.fw + gap;
  });
}

// keep old name as alias so existing callers still work
function ensurePrinterGroups(encW, encD, encH) { layoutPrinters(encW, encD, encH); }

// ── Render loop ────────────────────────────────────────────
(function animate(){
  requestAnimationFrame(animate);

  // Spring pop-in for printers
  const spring=0.12, damp=0.72;
  let layoutDirty = false;
  printerOrder.forEach(key => {
    const grp = printerGroups[key];
    if (!grp) return;
    const cur = printerScale[key];
    const tgt = printerTarget[key];
    if (grp._vel === undefined) grp._vel = 0;
    const force = (tgt - cur) * spring;
    grp._vel = grp._vel * damp + force;
    let next = cur + grp._vel;
    if (Math.abs(next-tgt)<0.001 && Math.abs(grp._vel)<0.001) { next=tgt; grp._vel=0; }
    // Recalculate layout when a printer crosses the visible threshold
    const wasActive = cur > 0.01;
    const isActive  = next > 0.01;
    if (wasActive !== isActive) layoutDirty = true;
    printerScale[key] = next;
    grp.scale.setScalar(Math.max(0,next));
  });
  { const {W,D,H}=state; ensurePrinterGroups(W,D,H); }

  renderer.render(scene,camera);
})();

// ── Init ───────────────────────────────────────────────────
initMobileLayout();
onResize();
updateStatus();
recalc();

// Try to load STEP files (works when served from http:// — run: python -m http.server 8080)
tryLoadSTEP();
// Load Voron printer GLB models in parallel (requires voron_*.glb in repo root)
loadAllVoronPrinters();
</script>
